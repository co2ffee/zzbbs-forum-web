name: Build and release forum-ui dist

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 用户端挂在站点根路径 /，使用默认 base
      - name: Build
        run: npm run build

      # 打包成固定文件名，服务器用稳定的下载地址拉取
      - name: Package dist
        run: tar -czf forum-ui.tar.gz -C dist .

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete deploy-latest --yes --cleanup-tag || true
          gh release create deploy-latest forum-ui.tar.gz \
            --title "Latest deploy build" \
            --notes "Built from commit ${{ github.sha }}"
